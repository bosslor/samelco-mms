          <!-- WORKER MY STATUS -->
          <div class="page" id="page-w-status">
            <div
              style="
                font-size: 13px;
                color: var(--text-muted);
                margin-bottom: 20px;
              "
            >
              Update your availability status
            </div>
            <div class="card" style="max-width: 500px">
              <div class="card-header">
                <div class="card-title">My Current Status</div>
              </div>
              <div class="card-body">
                <div style="text-align: center; margin-bottom: 20px">
                  <div
                    id="wMyStatusBadge"
                    style="
                      display: inline-block;
                      padding: 8px 24px;
                      border-radius: 20px;
                      font-size: 14px;
                      font-weight: 600;
                    "
                  ></div>
                </div>
                <div
                  style="
                    font-size: 13px;
                    color: var(--text-muted);
                    margin-bottom: 12px;
                  "
                >
                  Change your status:
                </div>
                <div
                  style="
                    display: grid;
                    grid-template-columns: repeat(2, 1fr);
                    gap: 10px;
                  "
                  id="wMyStatusOptions"
                ></div>
              </div>
            </div>
          </div>
