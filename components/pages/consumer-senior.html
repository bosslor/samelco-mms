          <!-- CONSUMER SENIOR CITIZEN DISCOUNT -->
          <div class="page" id="page-c-senior">
            <div
              style="
                font-size: 13px;
                color: var(--text-muted);
                margin-bottom: 20px;
              "
            >
              Apply for Senior Citizen discount under RA 9994
            </div>
            <div id="cSeniorExisting"></div>
            <div class="card" style="max-width: 650px" id="cSeniorForm">
              <div class="card-header">
                <div class="card-title">
                  Senior Citizen Discount Application
                </div>
              </div>
              <div class="card-body">
                <div
                  style="
                    padding: 12px 16px;
                    background: rgba(34, 197, 94, 0.08);
                    border: 1px solid rgba(34, 197, 94, 0.2);
                    border-radius: var(--radius-sm);
                    margin-bottom: 20px;
                    font-size: 12px;
                    color: var(--accent-green);
                    line-height: 1.6;
                  "
                >
                  ℹ️ This discount applies to senior citizens (60+) whose
                  monthly consumption does not exceed 100 kWh. A 5% discount
                  will be applied to your bill.
                </div>
                <div class="form-row form-row-2">
                  <div class="form-group">
                    <label class="form-label">Date of Birth</label
                    ><input type="date" class="form-input" id="cScDob" />
                  </div>
                  <div class="form-group">
                    <label class="form-label">Age</label
                    ><input
                      type="number"
                      class="form-input"
                      id="cScAge"
                      placeholder="Must be 60+"
                    />
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label">OSCA / Senior Citizen ID No.</label
                  ><input
                    type="text"
                    class="form-input"
                    id="cScId"
                    placeholder="Enter your SC membership number"
                  />
                </div>
                <div style="margin-top: 16px">
                  <label class="form-label">Upload Required Documents</label>
                  <div
                    style="
                      background: var(--bg-input);
                      border-radius: var(--radius-sm);
                      padding: 12px 16px;
                      margin-bottom: 12px;
                    "
                  >
                    <div class="checklist-item">
                      <input type="checkbox" id="cScDoc1" /><label for="cScDoc1"
                        >Proof of Age & Citizenship (Birth Cert / OSCA ID /
                        Gov't ID)</label
                      >
                    </div>
                    <div class="checklist-item">
                      <input type="checkbox" id="cScDoc2" /><label for="cScDoc2"
                        >Proof of Residence (Barangay Certificate)</label
                      >
                    </div>
                    <div class="checklist-item">
                      <input type="checkbox" id="cScDoc3" /><label for="cScDoc3"
                        >Latest Electric Bill in your name</label
                      >
                    </div>
                    <div class="checklist-item">
                      <input type="checkbox" id="cScDoc4" /><label for="cScDoc4"
                        >Authorization Letter (if someone files for you)</label
                      >
                    </div>
                  </div>
                  <div
                    class="file-upload"
                    onclick="document.getElementById('cScFileInput').click()"
                  >
                    <div class="file-upload-icon">📁</div>
                    <div class="file-upload-text">
                      Click to upload document scans
                    </div>
                    <div class="file-upload-hint">
                      PDF, JPG, PNG — Max 5MB each
                    </div>
                  </div>
                  <input
                    type="file"
                    id="cScFileInput"
                    multiple
                    accept=".pdf,.jpg,.jpeg,.png"
                    style="display: none"
                    onchange="handleFileUpload(this, 'cScFileList')"
                  />
                  <div class="file-list" id="cScFileList"></div>
                </div>
                <div
                  style="
                    margin-top: 20px;
                    display: flex;
                    gap: 12px;
                    justify-content: flex-end;
                  "
                >
                  <button
                    class="btn btn-success btn-sm"
                    onclick="consumerSubmitSenior()"
                    style="padding: 10px 24px"
                  >
                    Submit Application
                  </button>
                </div>
              </div>
            </div>
          </div>
