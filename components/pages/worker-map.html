          <!-- WORKER JOB MAP (GIS) -->
          <div class="page" id="page-w-map">
            <div
              style="
                font-size: 13px;
                color: var(--text-muted);
                margin-bottom: 16px;
              "
            >
              📍 Map view of your assigned service locations
            </div>
            <div class="card" style="overflow: hidden">
              <div class="card-header" style="padding: 12px 16px">
                <div
                  class="card-title"
                  style="display: flex; align-items: center; gap: 8px"
                >
                  <span style="font-size: 18px">🗺️</span> Job Locations
                </div>
                <div
                  style="font-size: 11px; color: var(--text-muted)"
                  id="wMapJobCount"
                >
                  0 locations
                </div>
              </div>
              <div
                id="workerJobMap"
                style="
                  height: 500px;
                  width: 100%;
                  background: var(--bg-input);
                  position: relative;
                "
              >
                <div
                  id="wMapLoading"
                  style="
                    position: absolute;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    text-align: center;
                    z-index: 500;
                  "
                >
                  <div style="font-size: 28px; margin-bottom: 8px">🗺️</div>
                  <div style="font-size: 13px; color: var(--text-muted)">
                    Loading map...
                  </div>
                </div>
              </div>
            </div>
            <div
              id="wMapLegend"
              style="
                margin-top: 14px;
                display: flex;
                gap: 16px;
                flex-wrap: wrap;
                font-size: 12px;
                color: var(--text-muted);
              "
            >
              <span>🟠 Service Request</span>
              <span>🟣 Reconnection</span>
              <span>🔵 New</span>
              <span>🟢 In Progress</span>
            </div>
            <div id="wMapJobList" style="margin-top: 16px"></div>
          </div>
